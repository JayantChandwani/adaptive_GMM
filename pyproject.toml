[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive_gmm"
version = "0.1.0"
description = "Adaptive Gaussian Mixture Models for clustering and density estimation."
requires-python = ">=3.10"


dependencies = [
    "numpy==2.3.2",
    "scipy==1.17.0",
    "scikit-learn==1.8.0",
    "matplotlib==3.10.6",
    "kagglehub==1.0.0",
    "pandas==3.0.2"
]